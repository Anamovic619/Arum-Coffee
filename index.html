<head>

<title>Kedai Kopi Arum — Rasa yang Menyatukan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1A1512;
  --bg-2:#221B15;
  --paper:#F7EFE0;
  --paper-2:#EFE3CC;
  --ink:#2C2117;
  --ink-dim:#6E5C48;
  --gold:#D9A05B;
  --gold-deep:#B57F3E;
  --cream:#F2EAE0;
  --line-dark:rgba(242,234,224,.16);
  --line-paper:rgba(44,33,23,.18);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
body{
  background:var(--bg);
  color:var(--cream);
  font-family:'Plus Jakarta Sans',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
img{max-width:100%;display:block}
a{color:inherit}

/* ---------- Hero ---------- */
.hero{
  min-height:88vh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;
  padding:64px 24px 56px;
  background:
    radial-gradient(ellipse 900px 500px at 50% -8%, #2A2119 0%, transparent 60%),
    var(--bg);
  position:relative;
}
.hero-logo{
  width:min(78vw, 340px);
  opacity:0;
  animation:riseIn .9s cubic-bezier(.16,1,.3,1) .1s forwards;
}
.tagline{
  font-family:'Fraunces',serif;
  font-weight:600;
  font-size:clamp(28px, 6vw, 48px);
  line-height:1.15;
  margin-top:22px;
  color:var(--gold);
  opacity:0;
  animation:riseIn .9s cubic-bezier(.16,1,.3,1) .3s forwards;
}
.hero-sub{
  max-width:460px;
  margin:16px auto 0;
  font-size:15.5px;
  line-height:1.65;
  color:var(--cream);
  opacity:0;
  animation:riseIn .9s cubic-bezier(.16,1,.3,1) .45s forwards;
}
.cta-row{
  margin-top:30px;
  display:flex;gap:12px;flex-wrap:wrap;justify-content:center;
  opacity:0;
  animation:riseIn .9s cubic-bezier(.16,1,.3,1) .6s forwards;
}
.btn{
  display:inline-flex;align-items:center;gap:9px;
  padding:14px 26px;border-radius:99px;
  font-weight:600;font-size:14.5px;
  text-decoration:none;
  transition:transform .18s ease, box-shadow .18s ease;
}
.btn:hover{transform:translateY(-2px)}
.btn-gold{background:var(--gold);color:#241A0F;box-shadow:0 10px 30px -12px rgba(217,160,91,.55)}
.btn-outline{border:1px solid var(--line-dark);color:var(--cream)}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

@keyframes riseIn{ from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:none} }
@media (prefers-reduced-motion: reduce){
  .hero-logo,.tagline,.hero-sub,.cta-row{animation:none;opacity:1}
}

.divider{
  display:flex;align-items:center;justify-content:center;gap:14px;
  color:var(--ink-dim);
  margin:0 auto;
}
.divider .ln{height:1px;width:56px;background:currentColor;opacity:.4}
.divider .mk{font-size:13px;opacity:.7}

/* ---------- Menu card ---------- */
.menu-wrap{padding:0 16px 90px;background:var(--bg)}
.menu-card{
  max-width:920px;margin:-28px auto 0;
  background:var(--paper);color:var(--ink);
  border-radius:22px;
  padding:60px 28px 44px;
  box-shadow:0 40px 80px -30px rgba(0,0,0,.55);
}
.menu-head{text-align:center;margin-bottom:38px}
.menu-head h2{
  font-family:'Fraunces',serif;font-weight:600;font-size:clamp(24px,4vw,32px);
  letter-spacing:.2px;
}
.menu-head .divider{color:var(--ink-dim);margin-top:10px}

.menu-list{column-count:1}
@media (min-width:720px){ .menu-list{column-count:2; column-gap:56px} }

.cat{margin-bottom:36px; break-inside:avoid}
.cat h3{
  font-family:'Fraunces',serif;font-weight:600;font-size:19px;
  color:var(--gold-deep);
}
.cat .divider{margin:8px 0 14px;justify-content:flex-start;gap:10px}
.cat .divider .ln{width:30px}

.item{
  display:flex;align-items:baseline;gap:10px;
  padding:8px 0;
  border-bottom:1px dashed var(--line-paper);
}
.item:last-child{border-bottom:none}
.item .nm{font-size:15px;font-weight:500}
.item .fill{flex:1;border-bottom:1px dotted transparent}
.item .pr{
  font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:500;
  color:var(--ink);white-space:nowrap;
}

/* ---------- Contact / footer ---------- */
.contact{
  padding:70px 24px 40px;text-align:center;background:var(--bg);
}
.contact h2{
  font-family:'Fraunces',serif;font-weight:600;font-size:clamp(22px,4vw,28px);
  color:var(--cream);
}
.contact p{color:var(--line-dark);margin-top:10px;font-size:14.5px}
.contact .btn-row{margin-top:24px;display:flex;justify-content:center}
footer{
  text-align:center;padding:28px 20px 40px;
  color:var(--ink-dim);font-size:12.5px;background:var(--bg);
  border-top:1px solid var(--line-dark);
}
footer .fname{color:var(--gold);font-weight:600}
</style>
</head>
